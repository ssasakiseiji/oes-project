services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./supabase-setup.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./inflacion_app_backend/migrations/002-prices-integrity.sql:/docker-entrypoint-initdb.d/02-prices-integrity.sql:ro
      - ./inflacion_app_backend/migrations/add-commerce-assignments.sql:/docker-entrypoint-initdb.d/03-commerce-assignments.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./inflacion_app_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3001
      NODE_ENV: production
      DB_USER: ${DB_USER}
      DB_HOST: postgres
      DB_DATABASE: ${DB_DATABASE}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_PORT: 5432
      DB_SSL: "false"
      DB_POOL_MAX: 10
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
      SENTRY_DSN: ${SENTRY_DSN:-}
    expose:
      - "3001"

  frontend:
    build:
      context: ./inflacion_app_frontend
      args:
        # Vacío a propósito: mismo origen, detrás del proxy nginx que monta
        # /api (ver nginx.conf). El código del frontend ya antepone /api a
        # cada request — un valor no vacío acá duplicaría el prefijo
        # (/api/api/...). Ver comentario en src/api.js.
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
