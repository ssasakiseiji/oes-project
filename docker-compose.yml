services:
  # Sin scripts de init: el schema lo crea `prisma migrate deploy`, que el
  # servicio backend corre al arrancar (ver inflacion_app_backend_nest/
  # Dockerfile y prisma/migrations/, Fase G). Antes se bootstrapeaba acá
  # con supabase-setup.sql + inflacion_app_backend/migrations/*.sql — esos
  # archivos quedan como referencia histórica, ya no los usa nada.
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./inflacion_app_backend_nest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3002
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_DATABASE}
      DB_SSL: "false"
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
    expose:
      - "3002"

  frontend:
    build:
      context: ./inflacion_app_frontend
      args:
        # Vacío a propósito: mismo origen, detrás del proxy nginx que monta
        # /api (ver nginx.conf). El código del frontend ya antepone /api a
        # cada request — un valor no vacío acá duplicaría el prefijo
        # (/api/api/...). Ver comentario en src/api.ts.
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
