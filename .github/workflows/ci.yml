name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: inflacion_app_backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: inflacion_app_backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: inflacion_app_frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: inflacion_app_frontend/package-lock.json
      - run: npm ci
      # TODO: sacar continue-on-error cuando se limpie la deuda de lint existente (ver informe de análisis)
      - run: npm run lint
        continue-on-error: true
      - run: npx vitest run
      - run: npm run build
