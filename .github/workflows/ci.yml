name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: inflacion_app_backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: inflacion_app_backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  backend-nest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: inflacion_app_backend_nest
    services:
      # Solo usada como shadow DB para el chequeo de drift de abajo —
      # `migrate diff --from-migrations` necesita replayar las migraciones
      # en una base real para saber a qué schema resultan.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: shadow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d shadow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: inflacion_app_backend_nest/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      # Falla si prisma/schema.prisma divergió de prisma/migrations/ sin
      # una migración nueva que lo documente (ver README, Fase G).
      - run: npx prisma migrate diff --from-migrations prisma/migrations --to-schema prisma/schema.prisma --exit-code
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/shadow
          SHADOW_DATABASE_URL: postgresql://ci:ci@localhost:5432/shadow
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run test:e2e

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: inflacion_app_frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: inflacion_app_frontend/package-lock.json
      - run: npm ci
      # TODO: sacar continue-on-error cuando se limpie la deuda de lint existente (ver informe de análisis)
      - run: npm run lint
        continue-on-error: true
      - run: npx vitest run
      - run: npm run build
