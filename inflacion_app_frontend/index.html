<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />

    <!-- Mobile-First Viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />

    <!-- Inter: cargada acá y no vía @import en el CSS a propósito. Un
         @import encadenado (index.css -> nocturne.css -> fonts.googleapis)
         recién se descubre después de parsear el CSS de la app, así que la
         fuente arranca tarde y se ve un flash con la fallback system-ui. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#0d0d0d" />
    <!-- El estándar es mobile-web-app-capable; el prefijo apple- quedó
         deprecado (Chrome avisa por consola) pero se mantiene porque iOS
         todavía lee ese y no el otro. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Portal de seguimiento del Índice de Precios al Consumidor" />

    <title>Plataforma de Investigación | U.N.I.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
